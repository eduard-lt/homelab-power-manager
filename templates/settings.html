<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Settings — Homelab Power</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f1115">
    <script>
        try { document.documentElement.dataset.theme = localStorage.getItem('homelab_pm_theme') || 'dark'; } catch (e) {}
    </script>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap">
    <header class="top">
        <h1>Settings</h1>
    </header>

    <!-- Login -->
    <form class="card" id="loginBox" autocomplete="on">
        <div class="label">Locked</div>
        <p class="muted small" style="margin-bottom:12px">Enter the settings password to continue.</p>
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        <button class="btn block" style="margin-top:12px" type="submit">Unlock</button>
        <p id="loginErr" class="small" style="color:var(--red);margin-top:8px"></p>
    </form>

    <!-- Settings (hidden until authenticated) -->
    <div id="settingsContent" hidden>
        <div class="seg">
            <button class="active" data-panel="formPanel">Form</button>
            <button data-panel="yamlPanel">YAML</button>
        </div>

        <div id="formPanel">
            <div class="label" style="margin:4px 4px 8px">Devices</div>
            <div id="devicesContainer"></div>
            <button class="btn ghost block" id="addDeviceBtn">+ Add device</button>

            <div class="label" style="margin:20px 4px 8px">General</div>
            <div class="card">
                <strong>Quiet hours</strong>
                <p class="muted small">Wake-ups are blocked in this window.</p>
                <div class="grid2">
                    <div class="field"><label>From (hour)</label><input type="number" id="restrictedStart" min="0" max="23" inputmode="numeric"></div>
                    <div class="field"><label>Until (hour)</label><input type="number" id="restrictedEnd" min="0" max="23" inputmode="numeric"></div>
                </div>
            </div>
            <div class="card">
                <strong>Settings password</strong>
                <div class="field"><input type="password" id="newPassword" placeholder="Leave blank to keep the current one" autocomplete="new-password"></div>
            </div>
            <button class="btn wake block" id="saveAllBtn">Save settings</button>
        </div>

        <div id="yamlPanel" hidden>
            <p class="muted small" style="margin-bottom:10px">
                Edit <code>config.yaml</code> directly. Changes apply immediately.
            </p>
            <textarea id="yamlEditor" class="code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
            <button class="btn wake block" style="margin-top:12px" id="saveYamlBtn">Save YAML</button>
        </div>
    </div>
</div>

<nav class="nav">
    <a href="/#home"><span class="i">⏻</span>Home</a>
    <a href="/#logs"><span class="i">☰</span>Logs</a>
    <a href="/settings" class="active"><span class="i">⚙</span>Settings</a>
</nav>

<script>
(() => {
    'use strict';
    const $ = (s, el = document) => el.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    let authToken = null;
    let devices = [];

    function authHeaders() {
        return { 'Content-Type': 'application/json', 'X-Settings-Password': authToken || '' };
    }

    let toastTimer;
    function toast(msg, isErr) {
        let el = $('.toast');
        if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
        el.textContent = msg;
        el.style.background = isErr ? 'var(--red)' : '';
        el.style.color = isErr ? '#fff' : '';
        el.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.hidden = true; }, 3500);
    }

    // ===== Panels =====
    document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('active', x === b));
        $('#formPanel').hidden = b.dataset.panel !== 'formPanel';
        $('#yamlPanel').hidden = b.dataset.panel !== 'yamlPanel';
        if (b.dataset.panel === 'yamlPanel') loadYaml();
    }));

    // ===== Login (password kept for this tab only, so a reload stays unlocked) =====
    async function unlock(pwd) {
        const resp = await fetch('/api/settings/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Settings-Password': pwd },
            body: JSON.stringify({ password: pwd }),
        });
        const data = await resp.json();
        if (!data.success) return false;
        authToken = pwd;
        try { sessionStorage.setItem('hpm_pwd', pwd); } catch (e) {}
        $('#loginBox').hidden = true;
        $('#settingsContent').hidden = false;
        await loadSettings();
        return true;
    }
    $('#loginBox').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            if (!await unlock($('#loginPassword').value)) $('#loginErr').textContent = 'Wrong password';
        } catch (err) {
            $('#loginErr').textContent = 'Connection error';
        }
    });
    try {
        const saved = sessionStorage.getItem('hpm_pwd');
        if (saved) unlock(saved).catch(() => {});
    } catch (e) {}

    // ===== Load settings =====
    async function loadSettings() {
        try {
            const resp = await fetch('/api/settings', { headers: authHeaders() });
            const data = await resp.json();
            devices = data.devices || [];
            const rh = data.restricted_hours || { start: 2, end: 7 };
            $('#restrictedStart').value = rh.start;
            $('#restrictedEnd').value = rh.end;
            renderDevices();
        } catch (e) {
            toast('Failed to load settings', true);
        }
    }

    // ===== Device cards =====
    const field = (label, cls, value, opts = {}) => `
        <div class="field"><label>${label}</label>
            <input type="${opts.type || 'text'}" class="${cls}" value="${esc(value)}" placeholder="${esc(opts.ph || '')}"
                ${opts.type === 'number' ? 'inputmode="numeric"' : 'autocapitalize="off" autocorrect="off" spellcheck="false"'}>
            ${opts.help ? `<div class="help">${opts.help}</div>` : ''}
        </div>`;

    function renderDevices() {
        $('#devicesContainer').innerHTML = devices.map((d, idx) => `
            <div class="card device-card" data-idx="${idx}">
                <div class="dev-head">
                    <h2>${esc(d.name) || 'New device'}</h2>
                    <button class="btn ghost sm" data-delete="${idx}" style="color:var(--red)">Delete</button>
                </div>
                ${field('Name *', 'dev-name', d.name, { ph: 'Server' })}
                <div class="grid2">
                    ${field('IP address *', 'dev-ip', d.ip, { ph: '192.168.1.100' })}
                    ${field('MAC address *', 'dev-mac', d.mac, { ph: 'AA:BB:CC:DD:EE:FF' })}
                </div>

                <fieldset><legend>Shutdown over SSH</legend>
                    <p class="help muted small" style="margin-top:6px">Leave the key path empty to hide the shutdown button.</p>
                    ${field('SSH key path (on the Pi)', 'dev-ssh-key', d.ssh_key_path, { ph: '/home/pi/.ssh/id_ed25519' })}
                    <div class="grid2">
                        ${field('SSH user', 'dev-ssh-user', d.ssh_username, { ph: 'pi' })}
                        ${field('SSH port', 'dev-ssh-port', d.ssh_port || 22, { type: 'number' })}
                    </div>
                    ${field('Key passphrase', 'dev-ssh-pass', d.ssh_key_passphrase, { type: 'password', ph: '(optional)' })}
                    ${field('Shutdown command', 'dev-shutdown-cmd', d.shutdown_command || 'suspend-now', {
                        ph: 'suspend-now',
                        help: 'Runs on the device. Exit code 3 means "busy, not shutting down" (goodnight).' })}
                    ${field('Progress command', 'dev-status-cmd', d.status_command || '', {
                        ph: 'goodnight --progress',
                        help: 'Optional. Lets the dashboard show each shutdown step live.' })}
                </fieldset>

                <fieldset><legend>Plex via Tautulli</legend>
                    <div class="grid2">
                        ${field('Tautulli IP', 'dev-tautulli-ip', d.tautulli_ip, { ph: '192.168.1.100' })}
                        ${field('Tautulli port', 'dev-tautulli-port', d.tautulli_port || 8181, { type: 'number' })}
                    </div>
                    ${field('Tautulli API key', 'dev-tautulli-key', d.tautulli_apikey, { type: 'password' })}
                </fieldset>
            </div>`).join('');
    }

    $('#devicesContainer').addEventListener('click', (e) => {
        const del = e.target.closest('[data-delete]');
        if (del && confirm('Delete this device?')) {
            devices = collectDevices();
            devices.splice(+del.dataset.delete, 1);
            renderDevices();
        }
    });

    $('#addDeviceBtn').addEventListener('click', () => {
        devices = collectDevices();
        devices.push({
            name: '', ip: '', mac: '',
            ssh_key_path: '', ssh_port: 22, ssh_username: '', ssh_key_passphrase: '',
            shutdown_command: 'suspend-now', status_command: '',
            tautulli_ip: '', tautulli_port: 8181, tautulli_apikey: '',
        });
        renderDevices();
        $('#devicesContainer').lastElementChild.scrollIntoView({ behavior: 'smooth' });
    });

    function collectDevices() {
        return Array.from(document.querySelectorAll('.device-card')).map(card => {
            const v = (c) => (card.querySelector(c)?.value || '').trim();
            return {
                name: v('.dev-name'),
                ip: v('.dev-ip'),
                mac: v('.dev-mac'),
                ssh_key_path: v('.dev-ssh-key'),
                ssh_port: parseInt(v('.dev-ssh-port')) || 22,
                ssh_username: v('.dev-ssh-user'),
                ssh_key_passphrase: card.querySelector('.dev-ssh-pass')?.value || '',
                shutdown_command: v('.dev-shutdown-cmd') || 'suspend-now',
                status_command: v('.dev-status-cmd'),
                tautulli_ip: v('.dev-tautulli-ip'),
                tautulli_port: parseInt(v('.dev-tautulli-port')) || 8181,
                tautulli_apikey: v('.dev-tautulli-key'),
            };
        });
    }

    // ===== Save =====
    $('#saveAllBtn').addEventListener('click', async () => {
        const newPassword = $('#newPassword').value;
        const start = parseInt($('#restrictedStart').value), end = parseInt($('#restrictedEnd').value);
        const payload = {
            restricted_hours: { start: isNaN(start) ? 2 : start, end: isNaN(end) ? 7 : end },
            devices: collectDevices(),
        };
        if (payload.devices.some(d => !d.name)) return toast('Every device needs a name', true);
        if (new Set(payload.devices.map(d => d.name)).size !== payload.devices.length) return toast('Device names must be unique', true);
        if (newPassword) payload.settings_password = newPassword;

        try {
            const resp = await fetch('/api/settings', { method: 'POST', headers: authHeaders(), body: JSON.stringify(payload) });
            const data = await resp.json();
            if (data.success) {
                if (newPassword) {
                    authToken = newPassword;
                    try { sessionStorage.setItem('hpm_pwd', newPassword); } catch (e) {}
                    $('#newPassword').value = '';
                }
                toast('Settings saved');
                await loadSettings();
            } else {
                toast(data.message || 'Failed to save settings', true);
            }
        } catch (e) {
            toast('Connection error while saving', true);
        }
    });

    // ===== YAML editor =====
    async function loadYaml() {
        try {
            const resp = await fetch('/api/settings/yaml', { headers: authHeaders() });
            const data = await resp.json();
            $('#yamlEditor').value = data.yaml || '';
        } catch (e) {
            toast('Failed to load YAML', true);
        }
    }

    $('#saveYamlBtn').addEventListener('click', async () => {
        try {
            const resp = await fetch('/api/settings/yaml', {
                method: 'POST', headers: authHeaders(), body: JSON.stringify({ yaml: $('#yamlEditor').value }),
            });
            const data = await resp.json();
            if (data.success) { toast('YAML saved'); await loadSettings(); }
            else toast(data.message || 'Invalid YAML', true);
        } catch (e) {
            toast('Connection error while saving', true);
        }
    });
})();
</script>
</body>
</html>
