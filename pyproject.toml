[project]
name = "homelab-power-manager"
version = "0.2.0"
description = "Remote device control panel (Flask) with WoL, SSH, and Plex monitoring"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "config", "devices", "plex", "logging_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
